DATASET: 'cityscale'

# IN1k + MAE only
NO_SAM: False

SAM_VERSION: 'sam2_hiera_b+'
SAM_CKPT_PATH: 'sam_ckpts/sam2.1_hiera_base_plus.pt'
USE_SKIP_CONNECTIONS: True
USE_CBAM: True
USE_HIGH_RES_TOPO: True
PATCH_SIZE: 512
BATCH_SIZE: 16
DATA_WORKER_NUM: 8
TRAIN_EPOCHS: 250
BASE_LR: 0.001
FREEZE_ENCODER: False
ENCODER_LR_FACTOR: 0.1
